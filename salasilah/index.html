<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Salasilah Keluarga Haji Taha &amp; Zainab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2620; --muted:#6f665a; --line:#e2d8c6;
  --accent:#1f5e3b; --accent-ink:#fff; --warn:#a4501b; --warn-bg:#fbeadb;
  --g1:#1f6b2e; --g2:#7fae73; --g3:#6c8ebf; --g4:#d79b00; --g5:#9a9184; --g6:#b9b1a4;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191713; --paper:#22201b; --ink:#efe8dc; --muted:#a99f90; --line:#3a352d;
    --accent:#5fb07f; --accent-ink:#10140f; --warn:#f0a874; --warn-bg:#3a2a1d; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{padding:22px 20px 10px;max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:2px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
nav{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted)}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.badge{display:inline-block;min-width:1.4em;padding:0 6px;border-radius:999px;background:var(--warn);color:#fff;font-size:.78rem;margin-left:4px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:16px 20px 80px}
.banner{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;color:var(--muted);font-size:.93rem}
.banner.warn{border-left-color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 240px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:4px 10px;font-size:.88rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:.9rem;color:var(--muted)}
.stat b{display:block;font-size:1.25rem;color:var(--ink);font-family:Fraunces,Georgia,serif}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:-4px 0 12px}
.legend span.realname::before{display:none}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.tree{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px}
.node>.row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;min-height:40px}
.node>.row:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}
.kids{margin-left:20px;border-left:1.5px dashed var(--line);padding-left:6px}
.tog{width:30px;height:30px;border:0;background:none;cursor:pointer;color:var(--muted);flex:none;border-radius:6px;font-size:.9rem}
.tog:disabled{visibility:hidden}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.name{border:0;background:none;padding:2px 4px;cursor:pointer;text-align:left;font-weight:700;border-radius:6px}
.name:hover{text-decoration:underline}
.nick,.spouse{color:var(--muted);font-size:.92rem}
.pill{font-size:.74rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.check{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.realname{font-size:.92rem;color:var(--ink)}
.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line)}
.portrait{width:120px;height:120px;border-radius:14px;object-fit:cover;border:1px solid var(--line);display:block;margin:10px 0}
.house{width:100%;max-height:260px;border-radius:10px;object-fit:cover;border:1px solid var(--line);margin-top:8px;display:block}
.homebox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0}
.homebox a{color:var(--accent)}
.homebox h3{margin:0 0 6px;font-size:1rem}
.upl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upl img{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.upl .st{font-size:.85rem;color:var(--muted)}
.sugimg{width:56px;height:56px;border-radius:8px;object-fit:cover;vertical-align:middle;border:1px solid var(--line)}
.realname.unconf{color:var(--muted);opacity:.65;font-style:italic}
.cnt{margin-left:auto;color:var(--muted);font-size:.82rem;white-space:nowrap;padding-right:4px}
mark{background:#ffe08a;color:#2b2620;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card h3{margin:0 0 4px;font-size:1rem}
.path{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:20px;text-align:center}
.sug .diff{margin:8px 0;font-size:.92rem}
.sug .diff div{padding:2px 0}
.sug .diff s{color:var(--muted)}
.sug .meta{color:var(--muted);font-size:.85rem}
.status{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.status.pending{color:var(--warn)} .status.approved{color:var(--accent)} .status.rejected{color:var(--muted)}
.help h2{font-family:Fraunces,Georgia,serif;font-size:1.25rem;margin:18px 0 6px}
.help ol,.help ul{padding-left:1.3em}
.help li{margin:4px 0}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.38);display:none;z-index:20}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--paper);z-index:21;transform:translateX(105%);transition:transform .2s ease;overflow-y:auto;box-shadow:-6px 0 24px rgba(0,0,0,.15);padding:18px 20px 40px}
.drawer.open{transform:none}
@media (max-width:640px){
  .drawer{top:auto;bottom:0;height:88%;width:100%;transform:translateY(105%);border-radius:16px 16px 0 0}
}
.drawer h2{font-family:Fraunces,Georgia,serif;font-size:1.5rem;margin:0}
.close{float:right;border:0;background:none;font-size:1.6rem;cursor:pointer;line-height:1;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0}
dt{color:var(--muted)} dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.childlist{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.92rem}
form label{display:block;margin:10px 0 3px;font-weight:700;font-size:.93rem}
form .hint{font-weight:400;color:var(--muted);font-size:.84rem}
form input[type=text],form input[type=number],form select,form textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
form textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;align-items:center;gap:8px;margin-top:12px}
.privacy{font-size:.84rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:14px}
.err{color:var(--warn);font-size:.9rem;margin-top:8px}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.88rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-t="title"></h1>
    <div class="sub" data-t="subtitle"></div>
    <div class="sub" data-t="credit" style="font-size:.88rem"></div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="ms">BM</button><button data-lang="en">EN</button>
  </div>
</header>
<nav role="tablist">
  <button role="tab" data-tab="tree" data-t="tabTree"></button>
  <button role="tab" data-tab="gaps" data-t="tabGaps"></button>
  <button role="tab" data-tab="sugs"><span data-t="tabSugs"></span><span id="sugBadge" class="badge" hidden></span></button>
  <button role="tab" data-tab="help" data-t="tabHelp"></button>
</nav>
<main>
  <div id="banner" class="banner" hidden></div>

  <section id="tab-tree">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input type="search" id="q" autocomplete="off">
      <button class="btn" id="expandAll" data-t="expandAll"></button>
      <button class="btn" id="collapseAll" data-t="collapseAll"></button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tree" id="tree"><div class="empty" data-t="loading"></div></div>
  </section>

  <section id="tab-gaps" hidden>
    <p data-t="gapsIntro"></p>
    <div class="grid" id="gaps"></div>
  </section>

  <section id="tab-sugs" hidden>
    <p id="sugIntro"></p>
    <div class="toolbar" id="ownerTools" hidden>
      <button class="btn" id="copyCsv" data-t="copyCsv"></button>
    </div>
    <div class="grid" id="sugs"></div>
  </section>

  <section id="tab-help" class="help" hidden></section>
</main>

<div id="gate" style="position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px">
  <form id="gateForm" style="background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:360px;width:100%">
    <h1 style="font-size:1.5rem;margin-bottom:4px">Salasilah Keluarga</h1>
    <p class="sub" style="margin:0 0 14px">Masukkan kata laluan keluarga / Enter the family password</p>
    <input id="pw" type="password" autocomplete="current-password" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)" autofocus>
    <div id="gateErr" class="err"></div>
    <button class="btn primary" style="margin-top:12px;width:100%">Buka / Open</button>
    <p class="sub" style="font-size:.84rem;margin:12px 0 0">Tiada kata laluan? Hubungi Hafiz (anak Azizah).</p>
  </form>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog"></aside>
<div class="toast" id="toast"></div>

  help:`<h2>Kenapa salasilah ini?</h2>
<p>Kita sedang menyusun salasilah keturunan Haji Taha &amp; Zainab supaya anak cucu kenal saudara-mara. Usaha ini dimulakan oleh Azizan dan masih banyak yang kosong.</p>
<h2>Hubungi</h2>
<p>Untuk sebarang pertanyaan atau maklumat, boleh hubungi <b>Hafiz (anak Azizah)</b>.</p>
<h2>Cara membantu</h2>
<ol>
<li>Cari nama ibu, bapa atau datuk nenek anda di tab <b>Salasilah</b>.</li>
<li>Klik nama itu. Tekan <b>+ Tambah anak</b> untuk menambah anak, atau <b>Betulkan / tambah maklumat</b> untuk membetulkan ejaan, nama panggilan, pasangan, tahun lahir dan sebagainya.</li>
<li>Tulis nama anda dan hubungan anda supaya Hafiz tahu siapa yang menghantar.</li>
<li>Hantar. Jika butang <b>Hantar melalui WhatsApp</b> keluar, tekan dan hantar mesej itu kepada Hafiz.</li>
</ol>
<h2>Apa yang paling diperlukan</h2>
<ul>
<li>Anak-anak dan cucu-cucu yang belum disenaraikan (lihat tab <b>Bantu isi</b>).</li>
<li>Nama penuh (bin/binti) atau nama panggilan, kerana ramai yang namanya sama, contohnya empat orang bernama Bedah.</li>

<li>Siapa yang sudah meninggal dunia.</li>
<li>Nama yang berwarna <span style="color:var(--muted);font-style:italic">kelabu</span> ialah nama sebenar yang belum disahkan. Jika anda tahu nama sebenar, sila betulkan.</li>
</ul>
<h2>Privasi</h2>
<p>Jangan masukkan no. kad pengenalan atau no. telefon. Alamat yang dimasukkan hanyalah rumah lama atau rumah pusaka, bukan alamat tempat tinggal sekarang. Kongsi gambar hanya jika tuan punya gambar bersetuju.</p>
<h2>Gambar &amp; rumah lama</h2>
<p>Anda boleh tambah gambar seseorang, alamat rumah lama, dan gambar rumah jika rumah itu di Perlis. Jika butang muat naik tiada, hantar gambar melalui WhatsApp kepada Hafiz (anak Azizah).</p>`

  help:`<h2>Why this tree?</h2>
<p>We're putting together the family tree of Haji Taha &amp; Zainab's descendants so the younger generations know their relatives. Azizan started this, and there are still many gaps.</p>
<h2>Contact</h2>
<p>For any questions or information, contact <b>Hafiz (son of Azizah)</b>.</p>
<h2>How to help</h2>
<ol>
<li>Find your parent's or grandparent's name in the <b>Tree</b> tab.</li>
<li>Click the name. Press <b>+ Add child</b> to add a child, or <b>Correct / add details</b> to fix spelling, nicknames, spouse, year born and so on.</li>
<li>Write your name and how you're related so Hafiz knows who sent it.</li>
<li>Send it. If a <b>Send on WhatsApp</b> button appears, press it and send the message to Hafiz.</li>
</ol>
<h2>What's most needed</h2>
<ul>
<li>Children and grandchildren not yet listed (see the <b>Help fill gaps</b> tab).</li>
<li>Full names (bin/binti) or nicknames, because many people share a name. There are four people called Bedah, for example.</li>
<li>Husbands/wives, birth order, and year born if known.</li>
<li>Who has passed away.</li>

const GENCOL = ["var(--g1)","var(--g2)","var(--g3)","var(--g4)","var(--g5)","var(--g6)"];

let db = null, user = null, myId = null, assets = null;
const blob = id => "/_blob/"+id;
function imgEl(id,cls,alt){ const i=el("img",{class:cls,src:blob(id),alt:alt||"",loading:"lazy"}); i.onerror=()=>{ i.style.visibility="hidden"; }; return i; }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rc = (node,...kids) => node.replaceChildren(...kids.flat().filter(k=>k!=null && k!==false));
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const k in attrs){
    const v = attrs[k];
    if(k==="class") n.className = v;
    else if(k==="text") n.textContent = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v===true) n.setAttribute(k,"");
    else if(v!==false && v!=null) n.setAttribute(k, v);
  }
  for(const c of kids.flat()) if(c!=null && c!==false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function toast(msg){ const x=$("#toast"); x.textContent=msg; x.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("show"),2200); }
function str(v){ return v==null ? "" : String(v); }

function index(){
  const kids = {}, roots = [];
  for(const id in state.people){
    const p = state.people[id]; const par = p.parent || "";
    if(par && state.people[par]) (kids[par] ||= []).push(id); else roots.push(id);
  }
  const sortF = (a,b)=> (Number(state.people[a].order)||999)-(Number(state.people[b].order)||999) || str(state.people[a].name).localeCompare(str(state.people[b].name));
  for(const k in kids) kids[k].sort(sortF);
  roots.sort(sortF);
  const gen = {};
  const walk = (id,g)=>{ gen[id]=g; (kids[id]||[]).forEach(c=>walk(c,g+1)); };
  roots.forEach(r=>walk(r,1));
  return {kids, roots, gen};
}
let IDX = {kids:{},roots:[],gen:{}};

function lineage(id){
  const out=[]; let cur=id, guard=0;
  while(cur && state.people[cur] && guard++<40){ out.unshift(cur); cur = state.people[cur].parent; }
  return out;
}
const BOOL = new Set(["deceased","check","nameConfirmed","inPerlis"]);
function realNameEl(p,q,always){
  const nm = str(p.name), prim = str(p.nick)||nm;
  if(p.nameConfirmed && nm && (always || nm!==prim)) return el("span",{class:"realname"}, highlight(nm,q||""));
  if(p.nameConfirmed) return null;
  if(nm && (always || nm!==prim)) return el("span",{class:"realname unconf",title:t("unconfirmed")}, highlight(nm,q||""));
  return el("span",{class:"realname unconf",title:t("unconfirmed"),text:t("realUnknown")});
}
function label(id){ const p=state.people[id]; if(!p) return "?"; return str(p.nick)||str(p.name)||"?"; }
function pathText(id){ return lineage(id).map(label).join(" › "); }

function renderLegend(){

function matches(id,q){
  const p=state.people[id]; return (str(p.name)+" "+str(p.nick)+" "+str(p.spouse)).toLowerCase().includes(q);
}
function highlight(text,q){
  if(!q) return document.createTextNode(text);
  const i = text.toLowerCase().indexOf(q); if(i<0) return document.createTextNode(text);
  const f=document.createDocumentFragment();
  f.append(text.slice(0,i), el("mark",{text:text.slice(i,i+q.length)}), text.slice(i+q.length));
  return f;
}

function renderTree(){
  const box = $("#tree");
  const ids = Object.keys(state.people);
  if(!ids.length){ rc(box,el("div",{class:"empty",text: state.mode==="loading" ? t("loading") : t("sugNone")})); return; }
  const q = state.q.trim().toLowerCase();
  let visible = null;
  if(q){
    visible = new Set();
    for(const id of ids) if(matches(id,q)) lineage(id).forEach(a=>visible.add(a));
  }
  const build = id => {
    if(visible && !visible.has(id)) return null;
    const p = state.people[id], kids = IDX.kids[id]||[], g = IDX.gen[id]||1;
    const open = q ? true : state.expanded.has(id);
    const row = el("div",{class:"row"},
      el("button",{class:"tog", disabled: !kids.length, "aria-label":"toggle", "aria-expanded": String(open),
        onclick:()=>{ state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id); renderTree(); }, text: kids.length ? (open?"▾":"▸") : ""}),
      (()=>{ const d=el("span",{class:"dot"}); d.style.background=GENCOL[Math.min(g-1,GENCOL.length-1)]; return d; })(),
      p.photo ? imgEl(p.photo,"avatar") : null,
      el("button",{class:"name", onclick:()=>openPerson(id)}, highlight(label(id), q)),
      realNameEl(p,q),
      p.spouse ? el("span",{class:"spouse"},"+ ", highlight(str(p.spouse),q)) : null,
      p.otherParent ? el("span",{class:"pill",text:(lang==="ms"?"ibu/bapa: ":"parent: ")+p.otherParent}) : null,
      p.deceased ? el("span",{class:"pill",text:t("deceased")}) : null,
      p.check ? el("span",{class:"pill check",text:t("check")}) : null,
      kids.length ? el("span",{class:"cnt",text:kids.length+" "+t("children")}) : null
    );
    const n = el("div",{class:"node"}, row);
    if(kids.length && open){ const k=el("div",{class:"kids"}); kids.forEach(c=>{ const b=build(c); if(b) k.append(b); }); n.append(k); }
    return n;
  };
  rc(box,...IDX.roots.map(build).filter(Boolean));
  if(q && !box.children.length) rc(box,el("div",{class:"empty",text:"—"}));
}

function renderGaps(){
  const box = $("#gaps"); rc(box);
  const cards = [];
  for(const id in state.people){
    const p = state.people[id], g = IDX.gen[id]||1, nk=(IDX.kids[id]||[]).length;
    const reasons = [];
    if(str(p.name).trim()==="?" ) reasons.push(t("gapUnknown"));
    if(p.check) reasons.push(t("gapCheck"));
    if(g<=3 && nk===0) reasons.push(t("gapNoKids"));
    if(reasons.length) cards.push({id,g,reasons});
  }
  cards.sort((a,b)=>a.g-b.g || pathText(a.id).localeCompare(pathText(b.id)));
  if(!cards.length){ box.append(el("div",{class:"empty",text:"✓"})); return; }
  for(const c of cards){
    box.append(el("div",{class:"card"},
      el("h3",{}, el("button",{class:"name",style:"padding:0",onclick:()=>openPerson(c.id)}, label(c.id))),
      el("div",{class:"path",text:pathText(c.id)}),
      el("div",{style:"margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"}, c.reasons.map(r=>el("span",{class:"pill check",text:r})))
    ));
  }
}

function fieldName(k){ return {photo:t("photo"),housePhoto:t("housePhoto"),pastAddress:t("pastAddress"),inPerlis:t("inPerlis"),nameConfirmed:t("nameConfirmed"),name:t("name"),nick:t("nick"),gender:t("gender"),order:t("order"),born:t("born"),deceased:t("isDeceased"),spouse:t("spouse"),otherParent:t("otherParent"),notes:t("notes"),check:t("needsCheck")}[k]||k; }

async function shrink(file){
  try{
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1400/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b = await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    return b || file;
  }catch(e){ return file; }
}

  }
  const fi = el("input",{type:"file",accept:"image/*",style:"display:none"});
  const pick = el("button",{type:"button",class:"btn small",text:t("choosePhoto"),onclick:()=>fi.click()});
  fi.onchange = async ()=>{
    const file = fi.files && fi.files[0]; if(!file) return;
    wrap.dataset.busy="1"; st.textContent=t("uploading"); pick.disabled=true;
    try{
      const b = await shrink(file);
      const typ = b.type && /^image\/(jpeg|png|gif|webp)$/.test(b.type) ? b.type : "image/jpeg";
      const r = await assets.upload(b,{type:typ});
      hidden.value = r.id; showPrev(r.id); st.textContent="";
    }catch(e){ st.textContent=t("uploadErr"); }
    delete wrap.dataset.busy; pick.disabled=false; fi.value="";
  };
  wrap.append(prev, pick, rm, fi, st);
  showPrev(str(cur));
  return wrap;
}

function readForm(f){
  const g = n => f.elements[n];
  return {
    name: g("name").value.trim(), nick: g("nick").value.trim(), gender: g("gender").value,
    order: g("order").value ? Number(g("order").value) : "", born: g("born").value.trim(),
    spouse: g("spouse").value.trim(), otherParent: g("otherParent").value.trim(), notes: g("notes").value.trim(),
    deceased: g("deceased").checked, check: g("check").checked, nameConfirmed: g("nameConfirmed").checked,
    photo: g("photo").value, pastAddress: g("pastAddress").value.trim(), inPerlis: g("inPerlis").checked, housePhoto: g("inPerlis").checked ? g("housePhoto").value : ""
  };
}

async function submitForm(f,type,targetId,direct){
  const err = f.querySelector("#ferr"); err.textContent="";
  const v = readForm(f);
  if(!v.name && !v.nick){ err.textContent=t("required"); return; }
  if(f.querySelector(".upl[data-busy]")){ err.textContent=t("wait"); return; }
  let data = v;
  if(type==="edit"){
    const cur = state.people[targetId]; data = {};
    for(const k of FIELDS){ if(str(cur[k])!==str(v[k]) && !BOOL.has(k) || (BOOL.has(k) && !!cur[k]!==!!v[k])) data[k]=v[k]; }
    if(!Object.keys(data).length){ err.textContent=t("nothingChanged"); return; }
  }
  const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
  if(direct){
    try{
      if(type==="add"){ const ref = db.collection("people").doc(); await ref.set({...data, parent:targetId}); state.expanded.add(targetId); }
      else await db.doc("people/"+targetId).update(data);
      toast(t("saved")); openPerson(targetId);
    }catch(e){ btn.disabled=false; err.textContent=t("saveErr"); }
    return;
  }
  const byName = f.elements.byName.value.trim();
  if(!byName){ btn.disabled=false; err.textContent=t("requiredYou"); return; }
  try{ localStorage.setItem("salasilah-by", byName); }catch(e){}
  const sug = { type, target:targetId, targetLabel:pathText(targetId), data, byName, by: myId||"", status:"pending", at:new Date().toISOString() };
  if(state.live && state.mode==="editor"){
    try{ await db.collection("suggestions").add(sug); toast(t("sent")); openPerson(targetId); return; }
    catch(e){ /* fall through to message */ }
  }
  showMessage(sug, targetId);
}

function sugMessage(s){
  const L=[ (lang==="ms"?"Salasilah Haji Taha & Zainab — cadangan":"Haji Taha & Zainab family tree — suggestion"),
    (s.type==="add"?t("sugAdd"):t("sugEdit"))+": "+s.targetLabel ];
  for(const k of FIELDS){ const v=s.data[k]; if(PHOTO.has(k)) continue; if(k in s.data && v!=="" && !(v===false && s.type==="add")) L.push(fieldName(k)+": "+fmtVal(k,v)); }
  L.push(t("from")+": "+s.byName);
  return L.join("\n");
}
function showMessage(s,targetId){
  const D=$("#drawer"); D.dataset.view="msg";
  const msg = sugMessage(s);
  rc(D,
    el("button",{class:"close",onclick:closeDrawer,text:"×"}),
    el("h2",{text:t("msgTitle")}),
    el("p",{class:"path",text:t("msgHint")}),
    el("pre",{class:"msg",text:msg}),
    el("div",{class:"actions"},
      el("a",{class:"btn primary",href:"https://wa.me/?text="+encodeURIComponent(msg),target:"_blank",rel:"noopener",text:t("whatsapp"),style:"text-decoration:none"}),
      el("button",{class:"btn",text:t("copy"),onclick:async()=>{ try{ await navigator.clipboard.writeText(msg); toast(t("copied")); }catch(e){ const r=document.createRange(); r.selectNodeContents(D.querySelector("pre")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); } }}),
      el("button",{class:"btn",text:t("cancel"),onclick:()=>openPerson(targetId)})
    ));
}

async function approve(s, btn){
  btn.disabled = true;
  try{
    if(s.type==="add"){
      if(!state.people[s.target]) throw new Error("parent missing");
      await db.collection("people").doc().set({ name:"",nick:"",gender:"",order:"",born:"",spouse:"",otherParent:"",notes:"",deceased:false,check:false,nameConfirmed:false,photo:"",pastAddress:"",inPerlis:false,housePhoto:"", ...s.data, parent:s.target });
    } else {
      if(!state.people[s.target]) throw new Error("person missing");
      await db.doc("people/"+s.target).update(s.data);
    }
    await db.doc("suggestions/"+s.id).update({status:"approved"});
    toast(t("saved"));
  }catch(e){ btn.disabled=false; toast(t("saveErr")); }
}
async function setSugStatus(s,status,btn){
  btn.disabled=true;
  try{ await db.doc("suggestions/"+s.id).update({status}); }catch(e){ btn.disabled=false; toast(t("saveErr")); }
}

$("#copyCsv").onclick = async ()=>{
  const cols=["id","generation","path",...FIELDS,"parent"];
  const esc=v=>{ v=str(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows=[cols.join(",")];
  const order=[]; const walk=id=>{ order.push(id); (IDX.kids[id]||[]).forEach(walk); }; IDX.roots.forEach(walk);
  for(const id of order){ const p=state.people[id]; rows.push([id,IDX.gen[id],pathText(id),...FIELDS.map(k=>p[k]),p.parent].map(esc).join(",")); }
  try{ await navigator.clipboard.writeText(rows.join("\n")); toast(t("copied")); }catch(e){ toast(t("saveErr")); }
};

/* ---------- tabs, search, lang ---------- */
function setTab(tab){
  state.tab=tab;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  ["tree","gaps","sugs","help"].forEach(x=> $("#tab-"+x).hidden = x!==tab);
}
document.querySelectorAll("nav button").forEach(b=> b.onclick=()=>setTab(b.dataset.tab));
document.querySelectorAll(".lang button").forEach(b=> b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem("salasilah-lang",lang)}catch(e){}; applyLang(); });
let qT; $("#q").addEventListener("input",e=>{ clearTimeout(qT); qT=setTimeout(()=>{ state.q=e.target.value; renderTree(); },150); });
$("#expandAll").onclick=()=>{ Object.keys(IDX.kids).forEach(id=>state.expanded.add(id)); renderTree(); };
$("#collapseAll").onclick=()=>{ state.expanded.clear(); IDX.roots.forEach(r=>state.expanded.add(r)); renderTree(); };

/* ---------- data ---------- */
function useSnapshot(){
  state.people = JSON.parse(JSON.stringify(SNAPSHOT)); state.live=false;
}
function initExpanded(){
  IDX = index();
  IDX.roots.forEach(r=>state.expanded.add(r));
}

async function start(){
  setTab("tree");
  useSnapshot(); initExpanded(); state.mode="loading"; applyLang();

  if(typeof claude==="undefined"){ document.querySelector('nav [data-tab="sugs"]').hidden=true; state.mode="readonly"; renderAll(); return; }
  [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]).catch(()=>[null,null,null]);
  const isOwner = user?.isOwner?.() ?? false;
  const canEdit = user?.canEdit?.() ?? false;
  try{ myId = user ? await user.id() : null; }catch(e){ myId=null; }

  if(!db){ state.mode="readonly"; renderAll(); return; }
  state.mode = isOwner ? "owner" : canEdit ? "editor" : "readonly";

  const timer = setTimeout(()=>{ if(!state.live){ state.slow=true; renderBanner(); } },10000);
  db.collection("people").onSnapshot(snap=>{
    if(snap.empty && snap.metadata.fromCache) return;
    if(snap.empty){ clearTimeout(timer); state.live=false; renderAll(); return; }
    clearTimeout(timer); state.slow=false;
    const ppl={}; snap.docs.forEach(d=>{ ppl[d.id]=d.data(); });
    const first = !state.live; state.people=ppl; state.live=true;
    if(first){ state.expanded.clear(); initExpanded(); }
    renderAll();
  }, err=>{ clearTimeout(timer); state.live=false; renderAll(); });

  if(state.mode!=="readonly"){
    db.collection("suggestions").onSnapshot(snap=>{
      state.sugs = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderStats(); renderSugs();
    }, ()=>{});
  }
}
async function unlock(pw){
  const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.n,hash:"SHA-256"}, base, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)}, key, b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryOpen(pw, quiet){
  try{
    SNAPSHOT = await unlock(pw);
    try{ sessionStorage.setItem("salasilah-pw", pw); }catch(e){}
    $("#gate").remove(); start(); return true;
  }catch(e){ if(!quiet) $("#gateErr").textContent = "Kata laluan salah / Wrong password"; return false; }
}
$("#gateForm").addEventListener("submit", async e=>{ e.preventDefault(); const b=e.target.querySelector("button"); b.disabled=true; $("#gateErr").textContent=""; await tryOpen($("#pw").value); b.disabled=false; });
(async()=>{ let saved=null; try{ saved=sessionStorage.getItem("salasilah-pw"); }catch(e){} if(saved) await tryOpen(saved,true); })();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cancer Cure Quest Junior</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
/* Cancer Cure Quest Junior: companion to the hospital-machines game for young children. Same toy-hospital look: tiled wall, chunky ink outlines, hard shadows. */
:root{
  --wall:#E3F6EF; --tile:#CFEFE3; --acc:#20B26B; --ink:#123C43; --ink-soft:#4A6B70;
  --coral:#FF6B4A; --sun:#FFC21A; --sky:#3AB0FF; --leaf:#20B26B; --card:#FFFFFF; --grey:#C9D6D3; --plum:#9B5FC0;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background-color:var(--wall);background-image:linear-gradient(var(--tile) 2px,transparent 2px),linear-gradient(90deg,var(--tile) 2px,transparent 2px);background-size:56px 56px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.app{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
button{font:inherit;color:inherit}
button:focus-visible,svg:focus-visible,input:focus-visible,canvas:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.kbring{position:fixed;width:36px;height:36px;border:4px solid var(--sun);border-radius:50%;box-shadow:0 0 0 3px var(--ink);pointer-events:none;z-index:40}
g[tabindex]:focus-visible{outline:none}g[tabindex]:focus-visible>*{filter:drop-shadow(0 0 4px #58B6E0) drop-shadow(0 0 4px #58B6E0)}

header.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:56px;height:60px;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);margin:0;line-height:1;letter-spacing:-.01em}
.brand h1 span{color:var(--coral)}
.brand p{margin:4px 0 0;color:var(--ink-soft);font-size:16px;max-width:46ch}
.toggles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.seg button{font:600 15px var(--display);border:0;background:transparent;padding:0 14px;min-height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.round{width:48px;height:48px;border:3px solid var(--ink);border-radius:50%;background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.round svg{width:24px;height:24px}
.round.sm{width:40px;height:40px}
.round.sm svg{width:20px;height:20px}
.round[aria-pressed="false"]{background:var(--grey)}

.helper{display:flex;gap:12px;align-items:flex-end;margin:22px 0 20px}
.ana{width:84px;flex:none}
.sina .shead{transform-box:fill-box;transform-origin:50% 90%;animation:snod 4.8s ease-in-out infinite}
.sina .blink{transform-box:fill-box;transform-origin:50% 50%;animation:sblink 5.2s infinite}
@keyframes snod{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-5deg)}88%{transform:rotate(3deg)}}
@keyframes sblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.sina .shead,.sina .blink{animation:none}}
.mentari{width:96px;flex:none}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px 14px 14px 18px;box-shadow:4px 4px 0 var(--ink);flex:1;min-width:0;display:flex;gap:12px;align-items:center}
.bubble::before{content:"";position:absolute;left:-15px;bottom:18px;width:22px;height:22px;background:var(--card);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.bubble p{margin:0;font-size:18px;flex:1;min-width:0;position:relative}
.bubble p.say{animation:say .35s ease-out}
@media (max-width:560px){.mentari{display:none}.ana{width:64px}.bubble p{font-size:17px}}

.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:620px){.rooms{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
.rooms.three{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.room{position:relative;text-align:left;border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:5px 5px 0 var(--ink);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.room:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.room:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.room .art{position:relative;background:var(--c);border-bottom:3px solid var(--ink);aspect-ratio:4/3;display:grid;place-items:center}
.room .art>svg{width:72%;height:auto;max-height:86%}
.room .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.room h2{font:700 22px var(--display);margin:0;line-height:1.1;text-wrap:balance;overflow-wrap:break-word}
.room .tag{color:var(--ink-soft);font-size:15px}
@media (max-width:619px){.room .meta{padding:10px 11px 12px}.room h2{font-size:18px}.room .tag{font-size:14px}}
.num{position:absolute;top:8px;left:8px;z-index:2;width:34px;height:34px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;font:700 17px var(--display)}
.room.locked .art>svg{filter:grayscale(.9);opacity:.45}
.lockb{position:absolute;inset:0;display:grid;place-items:center}
.lockb svg{width:44px;height:44px;background:var(--card);border:3px solid var(--ink);border-radius:50%;padding:7px}
.stars{display:flex;gap:3px;margin-top:6px}
.stars svg{width:26px;height:26px}

.cert{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;background:var(--sun);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:14px 18px}
.cert>svg{width:72px;flex:none}
.cert h2{font:700 24px var(--display);margin:0}
.cert p{margin:2px 0 0}
.cert>div{flex:1;min-width:180px}

footer{margin-top:34px;padding-top:16px;border-top:3px dashed var(--grey);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;color:var(--ink-soft);font-size:15px}
footer p{margin:0 0 6px;max-width:64ch}
footer a{color:var(--ink);font-weight:700}
.footL{flex:1 1 380px;min-width:0}
.footR{flex:0 1 260px;min-width:0}
.linkish{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink-soft);font-size:15px}

.playbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wingbar{margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 17px var(--display);border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:0 16px 0 10px;min-height:48px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.pill svg{width:22px;height:22px}
.playbar h2{font:700 clamp(21px,4vw,32px) var(--display);margin:0;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.1}
@media (max-width:480px){.play .pill .pl{display:none}.play .pill{padding:0 10px}}
.play .helper{margin:16px 0 0}
.play .ana{width:64px}
.stage{margin-top:16px;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:5px 5px 0 var(--ink);position:relative}
.gsvg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.drag{touch-action:none;cursor:grab}
.chips{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.chip{width:52px;height:52px;border:3px solid var(--ink);border-radius:14px;background:var(--card);display:grid;place-items:center;opacity:.35;filter:grayscale(1)}
.chip svg{width:34px;height:34px}
.chip.got{opacity:1;filter:none;background:var(--sun);animation:pop .45s}
@media (max-width:480px){.chips{gap:6px}.chip{width:36px;height:36px;border-radius:10px;border-width:2px}.chip svg{width:24px;height:24px}}
.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px;min-height:10px}
.cta{font:700 22px var(--display);letter-spacing:.02em;border:3px solid var(--ink);border-radius:999px;padding:0 30px;min-height:58px;background:var(--coral);color:var(--card);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.cta[disabled]{background:var(--grey);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
.cta.ready{animation:pulse 1s ease-in-out infinite}
.cta.ok{background:var(--leaf)}
.bar{width:min(220px,50vw);height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--leaf);transition:width .6s,background .6s}
.meter{display:flex;align-items:center;gap:8px;font:600 17px var(--display)}

.qa{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.q{font:600 21px var(--display);text-align:center;margin:0;max-width:40ch;text-wrap:balance}
.jobpic svg{width:min(260px,70vw);height:auto;display:block}
.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;width:100%;max-width:680px}
.mach{border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);font:600 16px var(--display);text-align:center;line-height:1.15}
.mach svg{width:84px;height:68px}
.mach.yes{background:#CDEFDD}
.mach.no{background:#FFD9CF;opacity:.7;box-shadow:none}
.mach.person svg{height:90px}
.scope{width:min(300px,78vw);height:auto;display:block}
.choice{font:700 20px var(--display);border:3px solid var(--ink);border-radius:18px;background:var(--card);min-height:62px;padding:0 22px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.choice svg{width:38px;height:38px}
.choice:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.choice[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.band{display:inline-flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:999px;background:#FFF6D6;padding:6px 20px 6px 8px;font:700 22px var(--display);letter-spacing:.08em}
.band svg{width:44px;height:44px}
.who{width:min(150px,40vw);height:auto}

.overlay{position:fixed;inset:0;background:rgba(18,60,67,.55);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow:auto}
.card{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;animation:pop .35s}
.card h2{font:700 30px var(--display);margin:0;text-align:center;text-wrap:balance}
.card p{margin:0}
.bigstars{display:flex;justify-content:center;gap:8px}
.bigstars svg{width:62px;height:62px}
.bigstars svg.on{animation:pop .5s backwards}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--wall);border-radius:16px;padding:10px 12px;font-size:16px}
.tip svg{width:46px;flex:none}
.eyebrow{font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:center}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opts{display:grid;gap:10px;width:100%;max-width:520px}
.opt{text-align:left;border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:12px 14px;cursor:pointer;font-size:18px;min-height:52px}
.opt.yes{background:#CDEFDD}.opt.no{background:#FFD9CF}
.medal{width:150px;margin:0 auto;display:block}
.certbox{border:5px double var(--ink);border-radius:18px;padding:14px;text-align:center;background:#FFFBEA;display:grid;gap:8px}
.certbox .nm{font:700 26px var(--display);min-height:1.2em;color:var(--coral)}
.namein{font:600 18px var(--display);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;width:100%}
.teamrow{display:flex;gap:4px 10px;justify-content:center;flex-wrap:wrap}
.teamrow figure{margin:0;width:64px;text-align:center;font:600 11px var(--display);line-height:1.15}
.teamrow svg{width:56px;height:62px;display:block;margin:0 auto 2px}
.small{font-size:14px;color:var(--ink-soft);text-align:center}

/* game bits */
.cellg{cursor:pointer}
.cin{transform-box:fill-box;transform-origin:center;animation:breathe 2.6s ease-in-out infinite}
.busy .cin{animation:split .8s ease-in-out infinite}
.stopall .cellg:not(.busy) .cin{animation-play-state:paused}
.born .cin{animation:born .45s ease-out,split .8s .45s ease-in-out infinite}
.found .cin>:first-child{stroke:var(--sun);stroke-width:7}
.cellg.wrong .cin{animation:shake .45s}
.tapme{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:glow 1.1s ease-in-out infinite}
.ouch{transform-box:fill-box;transform-origin:center;animation:shake .5s}
.flash{animation:flash .7s}
#tufts{transition:transform 1.4s ease-in,opacity 1.4s}
#tufts.fall{transform:translateY(70px);opacity:0}
#tufts.grow{animation:born .8s ease-out}
#beanie{opacity:0;transition:opacity .7s}
#beanie.on{opacity:1}
#lumpg{transition:transform 1s ease-in,opacity 1s;transform-box:fill-box;transform-origin:center}
#lumpg.lifted{transform:translate(230px,-170px) scale(.3);opacity:0}
.nextdot{transform-box:fill-box;transform-origin:center;animation:glow .9s ease-in-out infinite}
.zz{animation:zz 2s ease-in-out infinite}
.shake{animation:shake .45s}
.whob{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:0 14px 0 3px;min-height:48px;cursor:pointer;font:600 16px var(--display);max-width:210px}
.whob .wn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kh{display:block;border-radius:50%;overflow:hidden;border:3px solid var(--ink);flex:none;background:#fff}.kh svg{display:block;width:100%;height:100%}
.whob .kh{width:38px;height:38px;border-width:2px}
.field{display:grid;gap:6px}.field label,.flabel{font:600 16px var(--display)}
.field input{width:100%;font:600 22px var(--display);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;min-height:54px;background:var(--card);color:var(--ink)}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avopt{position:relative;cursor:pointer;display:block}.avopt input{position:absolute;opacity:0;pointer-events:none}
.avopt .kh{width:100%;aspect-ratio:1;height:auto;transition:transform .12s}.avopt:hover .kh{transform:scale(1.04)}
.avopt input:checked+.kh{box-shadow:0 0 0 4px var(--coral)}.avopt input:focus-visible+.kh{outline:4px solid var(--sky);outline-offset:3px}
.agerow{display:flex;flex-wrap:wrap;gap:8px}.ageopt{position:relative;cursor:pointer}.ageopt input{position:absolute;opacity:0;pointer-events:none}
.ageopt span{display:grid;place-items:center;min-width:52px;height:52px;padding:0 6px;border:3px solid var(--ink);border-radius:14px;background:var(--card);font:700 22px var(--display)}
.ageopt input:checked+span{background:var(--sun);box-shadow:0 0 0 3px var(--coral)}.ageopt input:focus-visible+span{outline:4px solid var(--sky);outline-offset:3px}
.agehint{margin:0;font-size:15px;color:var(--ink-soft);min-height:1.3em}.hiprev{text-align:center;font:600 20px var(--display);margin:0;min-height:1.4em}
.plist{display:grid;gap:8px;max-height:46vh;overflow:auto;padding:2px}.prow{display:flex;align-items:center;gap:8px}
.pbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:6px 12px 6px 6px;cursor:pointer;text-align:left;font:600 18px var(--display)}
.pbtn .kh{width:50px;height:50px}.pbtn small{display:block;font:400 14px var(--body);color:var(--ink-soft)}.pbtn.on{background:#FFF2CC}
.xbtn{border:3px solid var(--ink);border-radius:12px;background:var(--card);min-height:50px;padding:0 12px;cursor:pointer;font:600 14px var(--display);flex:none}.xbtn.arm{background:var(--coral);color:#fff}
.ebtn{border:3px solid var(--ink);border-radius:12px;background:var(--card);width:50px;height:50px;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--ink)}.ebtn svg{width:24px;height:24px}
.avpick{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}.avpick .kh{width:100%;aspect-ratio:1;height:auto}.avpick.on .kh{box-shadow:0 0 0 4px var(--coral)}.avpick:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.overlay{place-items:unset;justify-items:center}.overlay{grid-template-columns:minmax(0,1fr)}.overlay>.card{box-sizing:border-box;min-width:0}
@media (max-width:420px){.prow{gap:6px}.xbtn{padding:0 8px;font-size:13px}.ebtn{width:44px}.pbtn{gap:8px;padding:6px 8px 6px 6px;font-size:16px}.pbtn .kh{width:44px;height:44px}.pbtn>span:last-child{min-width:0;overflow-wrap:break-word}}.overlay>.card{margin:auto 0}
@media (max-height:800px),(max-width:420px){.card h2{font-size:clamp(22px,6vw,30px)}.avgrid{gap:8px;max-width:320px;margin:0 auto;width:100%}.ageopt span{min-width:46px;height:46px;font-size:20px}.agerow{gap:6px}}
.stage{box-shadow:6px 6px 0 var(--acc)!important;border-color:var(--ink)}
.playbar h2{color:var(--ink)}.play .playbar h2::after{content:"";display:block;width:64px;height:6px;border-radius:3px;background:var(--acc);margin-top:6px}
.ctwrap canvas{border-color:var(--acc)!important;border-width:4px!important}
.k .bubble p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.k .bubble p.open{-webkit-line-clamp:unset}
.k .ctwrap figure{font-size:0}.k .ctwrap figure>*{font-size:14px}
.glowbear{filter:drop-shadow(0 0 2px #FFC21A) drop-shadow(0 0 2px #FFC21A)}
.confetti{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:60;animation:fly 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.cheer{position:fixed;right:14px;bottom:14px;width:110px;z-index:55;pointer-events:none;animation:cheer 1.6s ease forwards}
@keyframes cheer{0%{transform:translateY(140px)}20%{transform:translateY(0) rotate(-6deg)}35%{transform:rotate(6deg)}50%{transform:rotate(-4deg)}80%{transform:translateY(0)}100%{transform:translateY(160px)}}
@media (prefers-reduced-motion:reduce){.confetti,.cheer{display:none}}
.ctwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:640px;align-items:start}
.ctwrap figure{margin:0;text-align:center;font:600 14px var(--display);color:var(--ink-soft)}
.ctwrap svg,.ctwrap canvas{width:100%;height:auto;display:block;border-radius:12px}
.ctwrap canvas{image-rendering:auto;background:#000;border:3px solid var(--ink)}
@media (max-width:520px){.ctwrap{grid-template-columns:1fr}}
.holdbtn{border:0;background:none;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdbtn svg{width:130px;height:130px;display:block}
.holdbtn:active svg{transform:scale(.96)}
.guide li{margin:0 0 8px}.guide ul{padding-left:18px;margin:0}.guide{max-height:70vh;overflow:auto;display:grid;gap:10px}

@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes split{0%,100%{transform:scale(1)}50%{transform:scale(1.16,.86)}}
@keyframes born{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes glow{50%{transform:scale(1.1)}}
@keyframes flash{50%{opacity:.35}}
@keyframes say{from{opacity:0;transform:translateY(4px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}50%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@media (prefers-reduced-motion:reduce){.cta.ready,.tapme,.nextdot,.zz,.cin{animation:none}.busy .cin{animation:split 1.6s ease-in-out infinite}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="ov"></div>
<script>
"use strict";
/* ---------- basics ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

// kbBtn: make an SVG element act like a button (Tab to it, Enter/Space to press)
function kbBtn(el,label){if(!el)return;el.setAttribute('tabindex','0');el.setAttribute('role','button');if(label)el.setAttribute('aria-label',label);
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}))}})}
// kbAim: picture you tap on; arrow keys move a target ring, Enter/Space taps there
function kbAim(el,label){if(!el)return;el.setAttribute('tabindex','0');el.setAttribute('aria-label',label+'. '+t('kb_aim'));let fx=.5,fy=.5,ring=null;
 const place=()=>{const r=el.getBoundingClientRect();ring.style.left=(r.left+fx*r.width-18)+'px';ring.style.top=(r.top+fy*r.height-18)+'px'};
 el.addEventListener('focus',()=>{ring=document.createElement('div');ring.className='kbring';document.body.appendChild(ring);place()});
 el.addEventListener('blur',()=>{if(ring){ring.remove();ring=null}});
 window.addEventListener('scroll',()=>{if(ring)place()},{passive:true});
 el.addEventListener('keydown',e=>{const st=e.shiftKey?.01:.04;let used=true;
  if(e.key==='ArrowLeft')fx-=st;else if(e.key==='ArrowRight')fx+=st;else if(e.key==='ArrowUp')fy-=st;else if(e.key==='ArrowDown')fy+=st;
  else if(e.key==='Enter'||e.key===' '){const r=el.getBoundingClientRect();el.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:r.left+fx*r.width,clientY:r.top+fy*r.height}))}else used=false;
  if(used){e.preventDefault();fx=Math.max(0,Math.min(1,fx));fy=Math.max(0,Math.min(1,fy));if(ring)place()}})}

 function newRound(){g.innerHTML='';live=true;const cols=k?3:4,rows=3+(k?0:1),r=k?36:27,x0=40,x1=k?560:500,y0=34,y1=346,cw=(x1-x0)/cols,ch=(y1-y0)/rows;

  function stitch(){say('surg_stitch');const g=$('#stitch');g.innerHTML=`<ellipse cx="300" cy="200" rx="${rin-6}" ry="${rin-14}" fill="#C97B78" stroke="${INK}" stroke-width="2.5"/>`;
   const pts=Array.from({length:7},(_,i)=>[250+i*16.7,i%2?226:174]);let nx=0;const ln=document.createElementNS(NS,'polyline');ln.setAttribute('fill','none');ln.setAttribute('stroke',INK);ln.setAttribute('stroke-width','5');ln.setAttribute('stroke-linecap','round');g.appendChild(ln);
   pts.forEach((p,i)=>{const d=document.createElementNS(NS,'g');d.innerHTML=`<circle cx="${p[0]}" cy="${p[1]}" r="22" fill="transparent"/><circle class="dt" cx="${p[0]}" cy="${p[1]}" r="10" fill="#fff" stroke="${INK}" stroke-width="3"/>`;d.style.cursor='pointer';d.id='sd'+i;g.appendChild(d);kbBtn(d,t('stitch_l')+' '+(i+1));
    d.onclick=()=>{if(i!==nx)return;sfx('pop');$('.dt',d).setAttribute('fill','#2FA673');d.classList.remove('nextdot');ln.setAttribute('points',pts.slice(0,i+1).map(q=>q.join(',')).join(' '));nx++;
     if(nx<pts.length)$('#sd'+nx).classList.add('nextdot');else{$('ellipse',g).setAttribute('fill','#F8D3C5');gotChip(3);say('surg_done');later(()=>finish('surg',starsFor(miss,1,4)),2000)}}});
   $('#sd0').classList.add('nextdot')}}};

/* 6c. Chemotherapy */
GAMES.chemo=(st,ctrl)=>{const k=K();let miss=0;setChips(k?2:4);
 const bags=shuffle([{f:'bear',n:'n_bear'},{f:'cat',n:'n_cat'},{f:'rabbit',n:'n_rab'}]);
 st.innerHTML=`<div class="qa"><div class="band">${face('bear')}MENTARI</div><div class="machines" style="max-width:520px">${bags.map(b=>`<button class="mach" data-f="${b.f}"><svg viewBox="0 0 80 100"><path d="M40 0 V10" stroke="${INK}" stroke-width="3"/><rect x="8" y="10" width="64" height="76" rx="14" fill="#FFF6D6" ${st3}/><svg x="18" y="24" width="44" height="44" viewBox="0 0 40 40">${face(b.f).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><path d="M40 86 v14" stroke="#58B6E0" stroke-width="4"/></svg><span>${t(b.n)}</span></button>`).join('')}</div></div>`;
 say('chemo_1');
 $$('.mach',st).forEach(b=>b.onclick=()=>{if(b.dataset.f==='bear'){sfx('good');b.classList.add('yes');gotChip(0);later(scene,700)}else{miss++;sfx('bad');b.classList.add('no','shake');b.disabled=true;say(tf('chemo_wrong',t(bags.find(x=>x.f===b.dataset.f).n)),true)}});
 function scene(){const bearInner=bear({noTufts:true}).replace(/^<svg[^>]*>|<\/svg>$/g,'');
  const beanie=BEANIE;
  let cc='';for(let i=0;i<6;i++){const a=i/6*Math.PI*2;cc+=`<circle class="cc" cx="${(322+Math.cos(a)*13).toFixed(1)}" cy="${(268+Math.sin(a)*11).toFixed(1)}" r="7" fill="#B07BD6" stroke="#fff" stroke-width="2"/>`}
  st.innerHTML=`<svg viewBox="0 0 600 400" class="gsvg" id="csv"><rect width="600" height="400" fill="#F3FAF7"/>
   <path d="M90 30 V380 M60 380 h60" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M74 40 h32" stroke="${INK}" stroke-width="4"/>
   <rect x="58" y="44" width="64" height="86" rx="14" fill="#FFF6D6" ${st3}/><svg x="70" y="62" width="40" height="40" viewBox="0 0 40 40">${face('bear').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>
   <rect id="medlvl" x="62" y="104" width="56" height="22" rx="8" fill="#58B6E0" opacity=".6"/>
   <rect x="82" y="134" width="16" height="22" rx="4" fill="#E6F5FB" stroke="${INK}" stroke-width="2.5"/><circle id="dropc" cx="90" cy="142" r="3.5" fill="#58B6E0" opacity="0"/>
   <path d="M90 156 Q118 290 240 282" fill="none" stroke="#58B6E0" stroke-width="5"/>
   <svg x="150" y="20" width="312" height="338" viewBox="0 0 120 130">${bearInner}<g id="beanie">${beanie}</g></svg>
   <g id="tufts"><path d="M285 60 l5 -12 l5 10 l5 -14 l5 14 l5 -12 l5 14 l5 -12 l5 10" fill="none" stroke="#2E2622" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
   <g fill="none" stroke="#FF8A73" stroke-width="4" stroke-linecap="round" opacity=".85"><path id="v0" d="M240 282 Q236 236 306 234"/><path id="v1" d="M306 234 Q246 210 252 110"/><path id="v2" d="M306 234 Q330 246 322 262"/><path id="v3" d="M306 234 Q362 232 372 280"/><path id="v4" d="M306 234 Q284 280 278 330"/></g>
   <g id="ccg">${cc}</g><g id="wave"></g></svg>`;
  say('chemo_2');let drips=0,energy=100,cyc=0;
  ctrl.innerHTML=(k?'':`<div class="meter">${t('energy')}<div class="bar"><i id="en"></i></div></div>`)+`<button class="cta ready" id="drip">${t('chemo_drip')}</button>`;
  const setE=v=>{energy=Math.max(5,Math.min(100,v));const e=$('#en');if(e){e.style.width=energy+'%';e.style.background=energy<40?'#F26B4F':energy<70?'#FFC53D':'#2FA673'}};setE(100);
  $('#drip').onclick=()=>{const b=$('#drip');b.disabled=true;b.classList.remove('ready');sfx('drip');const dc=$('#dropc');dc.setAttribute('opacity','1');later(()=>dc.setAttribute('opacity','0'),500);
   wave(()=>{drips++;const ccs=$$('.cc',st);ccs.slice(0,2).forEach(c=>{c.setAttribute('fill','#C9D6D3');c.classList.remove('cc');later(()=>c.remove(),700)});
    $('#medlvl').setAttribute('height',String(Math.max(2,22-drips*7)));$('#medlvl').setAttribute('y',String(126-Math.max(2,22-drips*7)));
    if(drips===1){$('#tufts').classList.add('fall');later(()=>$('#beanie').classList.add('on'),900);say('chemo_hair')}
    if(drips>=3){end();return}
    if(k){if(drips>1)say('chemo_more');later(()=>{b.disabled=false;b.classList.add('ready')},drips===1?3800:900)}
    else{setE(energy-38);later(restQ,drips===1?4200:1200)}})};
  function restQ(){say('chemo_rest_q');const b=$('#drip');b.style.display='none';
   const box=document.createElement('div');box.className='btnrow';box.id='rq';box.innerHTML=`<button class="choice" id="rRest">🛌 ${t('rest')}</button><button class="choice" id="rMore">💧 ${t('more')}</button>`;ctrl.appendChild(box);
   $('#rMore').onclick=()=>{miss++;sfx('bad');setE(energy-25);$('#rMore').disabled=true;say('chemo_rest_no')};
   $('#rRest').onclick=()=>{sfx('good');cyc++;gotChip(cyc);setE(100);say('chemo_rest_yes');box.remove();b.style.display='';later(()=>{b.disabled=false;b.classList.add('ready')},1200)}}
  function end(){say('chemo_done');gotChip(k?1:3);later(()=>{$('#beanie').classList.remove('on');const tf_=$('#tufts');tf_.classList.remove('fall');tf_.classList.add('grow')},2200);later(()=>finish('chemo',starsFor(miss,0,1)),4600)}}
 function wave(done){const main=$('#v0'),br=['#v1','#v2','#v3','#v4'].map(s=>$(s)),L0=main.getTotalLength(),Ls=br.map(b=>b.getTotalLength()),layer=$('#wave'),t0=performance.now(),dur=2000;
  function fr(now){const tt=(now-t0)/dur;let h='';for(let q=0;q<5;q++){const u=tt-q*.07;if(u<0||u>1)continue;
    const pts=u<.35?[main.getPointAtLength(L0*u/.35)]:br.map((b,j)=>b.getPointAtLength(Ls[j]*(u-.35)/.65));
    pts.forEach(p=>h+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="#58B6E0" stroke="#fff" stroke-width="2"/>`)}
   layer.innerHTML=h;if(tt<1.3)raf=requestAnimationFrame(fr);else{layer.innerHTML='';done()}}
  raf=requestAnimationFrame(fr)}};

document.documentElement.lang=S.lang==='bm'?'ms':'en';
go('home');if(!curP())showWho();
